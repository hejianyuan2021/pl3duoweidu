name: Build PL3 Android APK

on:
  push:
  workflow_dispatch:
    inputs:
      source_zip:
        description: '可选：仓库根目录的源码ZIP文件名；只有一个时自动识别'
        required: false
        default: ''
        type: string
      project_dir:
        description: '可选：已解压的Android工程目录；留空自动识别'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9 (no Wrapper required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or extract source
        id: source
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
          PROJECT_DIR: ${{ inputs.project_dir }}
        shell: python
        run: |
          import os, sys, zipfile, shutil, stat
          from pathlib import Path, PurePosixPath

          ROOT = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          EXTRACT = ROOT / ".ci-source"
          MAX_BYTES = 200 * 1024 * 1024

          def candidates(folder):
              paths = list(folder.rglob("settings.gradle.kts")) + list(folder.rglob("settings.gradle"))
              return sorted({p.parent.resolve() for p in paths if not any(x in {".git", ".gradle", "build", ".ci-source"} for x in p.relative_to(folder).parts) and (p.parent / "app").is_dir()})

          def safe_extract(archive):
              if EXTRACT.exists(): shutil.rmtree(EXTRACT)
              EXTRACT.mkdir()
              with zipfile.ZipFile(archive) as z:
                  entries = z.infolist()
                  if len(entries) > 10000 or sum(i.file_size for i in entries) > MAX_BYTES:
                      raise ValueError("Source ZIP too large")
                  written = 0
                  for item in entries:
                      name = item.filename.replace("\\", "/")
                      path = PurePosixPath(name)
                      mode = item.external_attr >> 16
                      if path.is_absolute() or ".." in path.parts or any(":" in x for x in path.parts) or stat.S_ISLNK(mode):
                          raise ValueError("Unsafe archive member: " + name)
                      target = (EXTRACT / name).resolve()
                      target.relative_to(EXTRACT.resolve())
                      if item.is_dir(): target.mkdir(parents=True, exist_ok=True); continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, target.open("wb") as dst:
                          while True:
                              chunk = src.read(65536)
                              if not chunk: break
                              written += len(chunk)
                              if written > MAX_BYTES: raise ValueError("Extracted bytes exceed limit")
                              dst.write(chunk)
              # Search under extracted root; ignore nested build output but not .ci-source itself.
              settings = list(EXTRACT.rglob("settings.gradle.kts")) + list(EXTRACT.rglob("settings.gradle"))
              return sorted({p.parent.resolve() for p in settings if (p.parent / "app").is_dir()})

          archive_arg = os.environ.get("SOURCE_ZIP", "").strip()
          project_arg = os.environ.get("PROJECT_DIR", "").strip()
          if project_arg:
              project = (ROOT / project_arg).resolve()
              project.relative_to(ROOT)
              projects = [project]
          elif archive_arg:
              archive = (ROOT / archive_arg).resolve(); archive.relative_to(ROOT)
              projects = safe_extract(archive)
          else:
              projects = candidates(ROOT)
              if not projects:
                  archives = sorted(ROOT.glob("*.zip"))
                  usable = []
                  for archive in archives:
                      try:
                          with zipfile.ZipFile(archive) as z:
                              if any(PurePosixPath(n).name in {"settings.gradle", "settings.gradle.kts"} for n in z.namelist()):
                                  usable.append(archive)
                      except zipfile.BadZipFile:
                          pass
                  if len(usable) != 1:
                      raise SystemExit("Expected one Android source ZIP at repository root, or an extracted Android project. Use workflow input source_zip if ambiguous.")
                  projects = safe_extract(usable[0])
          if len(projects) != 1:
              raise SystemExit("Expected exactly one Android app project; found: " + repr(projects))
          project = projects[0]
          if not ((project / "settings.gradle.kts").exists() or (project / "settings.gradle").exists()):
              raise SystemExit("No settings.gradle[.kts] in selected project")
          if not (project / "app").is_dir(): raise SystemExit("Missing app module")
          sdk = os.environ.get("ANDROID_SDK_ROOT") or os.environ.get("ANDROID_HOME")
          if sdk:
              escaped = sdk.replace("\\", "\\\\").replace(":", "\\:")
              (project / "local.properties").write_text("sdk.dir=" + escaped + "\n", encoding="utf-8")
          rel = project.relative_to(ROOT).as_posix()
          if any(c in rel for c in "\r\n"): raise SystemExit("Invalid project path")
          output = os.environ.get("GITHUB_OUTPUT")
          if output:
              with open(output, "a", encoding="utf-8") as f: f.write("project=" + rel + "\n")
          print("Selected Android project:", rel)

      - name: Independent history regression
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          if [ -f tools/verify_data.py ]; then
            python3 tools/verify_data.py
          elif [ -f tools/verify_fixture.py ]; then
            python3 tools/verify_fixture.py
          else
            echo 'No optional Python fixture script; Gradle tests still run.'
          fi

      - name: Test and build Debug APK
        working-directory: ${{ steps.source.outputs.project }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pl3-debug-apk-${{ github.run_number }}
          path: ${{ steps.source.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pl3-build-reports-${{ github.run_number }}
          path: |
            android-build.log
            **/app/build/reports/tests/**
            **/app/build/test-results/**
            .ci-source/**/app/build/reports/tests/**
            .ci-source/**/app/build/test-results/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
